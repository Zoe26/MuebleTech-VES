
services:
  - type: web
    name: muebletech-ves-api
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt
   
    startCommand: sh -c 'flask --app main db upgrade && exec gunicorn --bind 0.0.0.0:$PORT main:app'


    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"

      # Conexión con PostgreSQL de Render
      - key: DATABASE_URL
        fromDatabase:
          name: muebletech-ves-db
          property: connectionString

      # Clave secreta para autenticación JWT
      - key: JWT_SECRET_KEY
        generateValue: true

      # Desactivar el modo de depuración
      - key: FLASK_DEBUG
        value: "0"
