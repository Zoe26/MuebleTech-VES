
tags:
  - Productos

summary: Eliminar un producto
description: >
  Elimina un producto existente de PostgreSQL
  utilizando SQLAlchemy y su código identificador.

produces:
  - application/json

parameters:
  - in: path
    name: codigo
    type: integer
    required: true
    description: Código del producto que se desea eliminar.

responses:
  200:
    description: Producto eliminado correctamente.
    schema:
      type: object
      properties:
        mensaje:
          type: string
          example: Producto eliminado correctamente
        producto:
          type: object
          properties:
            codigo:
              type: integer
              example: 5
            nombre:
              type: string
              example: Mesa industrial premium
            precio:
              type: number
              format: float
              example: 650.00
            stock:
              type: integer
              example: 10
            id_categoria:
              type: integer
              example: 1

  404:
    description: Producto no encontrado.
    schema:
      type: object
      properties:
        mensaje:
          type: string
          example: Producto no encontrado

  500:
    description: Error al eliminar el producto.
