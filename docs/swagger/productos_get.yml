
tags:
  - Productos

summary: Listar productos
description: >
  Consulta los productos registrados en PostgreSQL
  mediante SQLAlchemy. Incluye el nombre de la
  categoría asociada a cada producto.

produces:
  - application/json

responses:
  200:
    description: Listado de productos obtenido correctamente.
    schema:
      type: object
      properties:
        mensaje:
          type: string
          example: Listado de productos
        total:
          type: integer
          example: 4
        productos:
          type: array
          items:
            type: object
            properties:
              codigo:
                type: integer
                example: 1
              nombre:
                type: string
                example: Mesa industrial
              precio:
                type: number
                format: float
                example: 450.00
              stock:
                type: integer
                example: 10
              categoria:
                type: string
                example: Mesas

  500:
    description: Error interno del servidor.
