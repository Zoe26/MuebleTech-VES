
tags:
  - Productos
summary: Actualizar un producto existente
description: Actualiza los datos de un mueble industrial mediante su código.
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: path
    name: codigo
    type: integer
    required: true
    description: Código del producto que se desea actualizar.
    example: 4

  - in: body
    name: producto
    required: true
    description: Nuevos datos del producto.
    schema:
      type: object
      required:
        - nombre
        - precio
        - stock
        - categoria
      properties:
        nombre:
          type: string
          example: Escritorio industrial premium
        precio:
          type: number
          example: 890.0
        stock:
          type: integer
          example: 12
        categoria:
          type: string
          example: Escritorios

responses:
  200:
    description: Producto actualizado correctamente.
  400:
    description: Datos inválidos o campos obligatorios faltantes.
  404:
    description: Producto no encontrado.
