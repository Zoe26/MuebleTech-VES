
tags:
  - Productos

summary: Actualizar un producto
description: Actualiza un producto existente en PostgreSQL mediante SQLAlchemy.

consumes:
  - application/json

produces:
  - application/json

parameters:
  - in: path
    name: codigo
    type: integer
    required: true
    description: Código del producto que se desea actualizar.

  - in: body
    name: body
    required: true
    description: Nuevos datos del producto.
    schema:
      type: object
      required:
        - nombre
        - precio
        - stock
        - id_categoria
      properties:
        nombre:
          type: string
          example: Mesa industrial premium
        precio:
          type: number
          format: float
          example: 650.00
        stock:
          type: integer
          example: 12
        id_categoria:
          type: integer
          example: 1

responses:
  200:
    description: Producto actualizado correctamente.
  400:
    description: Datos inválidos o categoría inexistente.
  401:
    description: Token JWT ausente, inválido o vencido.
  403:
    description: Usuario sin permisos de administrador.
  404:
    description: Producto no encontrado.
  500:
    description: Error al actualizar el producto.



security:
  - Bearer: []
