
tags:
  - Categorías

summary: Registrar una categoría
description: Permite registrar una categoría. Requiere rol EDITOR o ADMIN.

consumes:
  - application/json

produces:
  - application/json

security:
  - Bearer: []

parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          example: Estanterías
        descripcion:
          type: string
          example: Estanterías industriales

responses:
  201:
    description: Categoría registrada correctamente
  400:
    description: Datos inválidos
  401:
    description: Token ausente o inválido
  403:
    description: Usuario sin permisos
  409:
    description: La categoría ya existe
  500:
    description: Error interno del servidor
