
tags:
  - Productos

summary: Registrar un producto
description: Registra un nuevo producto en PostgreSQL mediante SQLAlchemy.

consumes:
  - application/json

produces:
  - application/json

parameters:
  - in: body
    name: body
    required: true
    description: Datos del producto que se registrará.
    schema:
      type: object
      required:
        - nombre
        - precio
        - stock
        - id_categoria
      properties:
        nombre:
          type: string
          example: Mesa industrial moderna
        precio:
          type: number
          format: float
          example: 450.00
        stock:
          type: integer
          example: 10
        id_categoria:
          type: integer
          example: 1

responses:
  201:
    description: Producto registrado correctamente.
  400:
    description: Datos inválidos o categoría inexistente.
  500:
    description: Error al registrar el producto.
