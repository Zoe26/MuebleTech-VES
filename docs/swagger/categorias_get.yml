
tags:
  - Categorías

summary: Listar categorías
description: Obtiene todas las categorías registradas en PostgreSQL.

produces:
  - application/json

responses:
  200:
    description: Listado de categorías obtenido correctamente
    schema:
      type: object
      properties:
        mensaje:
          type: string
        total:
          type: integer
        categorias:
          type: array
          items:
            type: object
            properties:
              id_categoria:
                type: integer
              nombre:
                type: string
              descripcion:
                type: string
  500:
    description: Error interno del servidor
